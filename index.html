<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>영어 통번역 연습</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 통번역">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* ────────────────────────────────────────────────────────────
   DESIGN TOKENS  (참고 파일 그대로)
──────────────────────────────────────────────────────────── */
:root {
  --accent: #10b981;
  --accent-dark: #047857;
  --accent-soft: #ecfdf5;
  --accent-mid: #a7f3d0;
  --ink: #0f172a;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --surface: rgba(255,255,255,.88);
  --surface-strong: #ffffff;
  --surface-soft: #f8fafc;
  --danger: #dc2626;
  --bg1: #f0fdf4;
  --bg2: #f8fafc;
  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --shadow-sm: 0 8px 24px rgba(15,23,42,.06);
  --shadow-md: 0 18px 42px rgba(15,23,42,.10);
  --shadow-lg: 0 28px 64px rgba(15,23,42,.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(16,185,129,.12), transparent 28%),
    radial-gradient(circle at top right, rgba(14,165,233,.08), transparent 22%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
}
button, input { font-family: inherit; }
.screen { display: none; }
.screen.active { display: block; }

/* ── TOP BAR ── */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 74px;
  padding: 14px 18px;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(226,232,240,.85);
}
.top-slot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
}
.top-slot.grow {
  flex: 1 1 auto;
  min-width: 0;
  justify-content: center;
}
.top-title {
  font-size: clamp(1.05rem, 2vw, 1.2rem);
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.brand-title::before { content: none; }

/* Tap highlight 제거 */
.icon-btn, .main-menu-link, .ctrl-btn, .nav-arrow, .home-btn,
.show-answer-btn, .menu-btn, .tts-btn, .fav-del {
  -webkit-tap-highlight-color: transparent;
}

/* ── ICON-BTN (pill, top-bar 단어장/북마크) ── */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.9);
  color: var(--ink);
  font-size: .92rem;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.icon-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(16,185,129,.35);
  box-shadow: var(--shadow-md);
  background: #fff;
}
.icon-btn .em { font-size: 1.05rem; }

/* ── HOME-BTN / NAV-ARROW (round) ── */
.home-btn, .nav-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.92);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.home-btn:hover, .nav-arrow:hover {
  transform: translateY(-1px);
  border-color: rgba(16,185,129,.4);
  box-shadow: var(--shadow-md);
}
.nav-arrow:disabled {
  opacity: .4;
  pointer-events: none;
}

/* ── MAIN-MENU-LINK (learn 상단 중앙) ── */
.main-menu-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid rgba(16,185,129,.28);
  border-radius: 999px;
  background: linear-gradient(180deg, #ffffff, var(--accent-soft));
  color: var(--accent-dark);
  font-size: .92rem;
  font-weight: 800;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}
.main-menu-link:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

/* ── PAGE WRAPPERS ── */
.menu-body, .home-body, .learn-body, .list-body {
  width: min(980px, calc(100% - 28px));
  margin: 0 auto;
}
.menu-body { padding: 30px 0 54px; }

/* ── HERO CARD ── */
.hero-card {
  background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(255,255,255,.82));
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 30px;
  box-shadow: var(--shadow-lg);
  padding: clamp(24px, 4vw, 36px);
  margin-bottom: 20px;
}
.menu-title {
  font-size: clamp(1.75rem, 4vw, 2.4rem);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 10px;
  text-align: center;
}
.menu-subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.65;
  max-width: 620px;
  margin: 0 auto 26px;
}

/* ── MENU GRID ── */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.menu-btn {
  min-height: 190px;
  border: 1px solid rgba(226,232,240,.95);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.88));
  box-shadow: var(--shadow-md);
  cursor: pointer;
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  text-align: left;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.menu-btn:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(16,185,129,.34);
}
.menu-icon {
  width: 56px;
  height: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: linear-gradient(180deg, var(--accent-soft), #fff);
  font-size: 1.65rem;
  box-shadow: inset 0 0 0 1px rgba(16,185,129,.1);
}
.menu-label {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--ink);
  margin-top: 14px;
}
.menu-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--accent-dark);
  font-size: .84rem;
  font-weight: 800;
  border: 1px solid rgba(16,185,129,.14);
}

/* ── SECTION CARD (내부 시트 목록용) ── */
.home-body { padding: 26px 0 54px; }
.section-card {
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.85));
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  padding: clamp(18px, 3vw, 28px);
}
.category-heading {
  font-size: clamp(1.3rem, 2.5vw, 1.65rem);
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  margin-bottom: 16px;
}
.search-wrap { position: relative; margin-bottom: 18px; }
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1rem;
}
#searchInput {
  width: 100%;
  min-height: 52px;
  padding: 14px 16px 14px 46px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255,255,255,.95);
  color: var(--ink);
  font-size: 1rem;
  outline: none;
  box-shadow: var(--shadow-sm);
  transition: border-color .2s ease, box-shadow .2s ease;
}
#searchInput:focus {
  border-color: rgba(16,185,129,.48);
  box-shadow: 0 0 0 4px rgba(16,185,129,.12), var(--shadow-sm);
}
.sheet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.sheet-btn {
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 20px;
  padding: 22px 18px;
  background: linear-gradient(180deg, #fff, #fbfdff);
  color: var(--ink);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.5;
  text-align: left;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.sheet-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: rgba(16,185,129,.34);
}

/* ── LEARN ── */
.learn-body {
  padding: 22px 0 64px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.learn-sheet-heading {
  text-align: center;
  color: var(--muted);
  font-size: .95rem;
  font-weight: 700;
}
.card {
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.9));
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  min-height: 190px;
  padding: 34px 28px 30px;
}
.card-label {
  position: absolute;
  top: 0;
  left: 22px;
  transform: translateY(-1px);
  padding: 7px 12px;
  border-radius: 0 0 14px 14px;
  background: var(--accent);
  color: white;
  font-size: .74rem;
  letter-spacing: .04em;
  font-weight: 800;
}
.card-text {
  width: 100%;
  font-size: clamp(1.18rem, 2.6vw, 1.45rem);
  line-height: 1.75;
  font-weight: 500;
  word-break: keep-all;
  color: var(--ink);
}
.answer-cover {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 28px;
  background: rgba(255,255,255,.96);
  color: var(--muted);
  font-weight: 700;
  z-index: 10;
}
.answer-cover.hide { display: none; }
.hint-icon { font-size: 1.25rem; }
.tts-btn {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid rgba(226,232,240,.95);
  background: linear-gradient(180deg, #fff, var(--accent-soft));
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 1rem;
}
.tts-btn:hover { box-shadow: var(--shadow-md); }

/* ── PROGRESS / NAV PANEL / LIST PANEL ── */
.progress-wrap, .nav-panel, .list-panel {
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.86));
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 24px;
  box-shadow: var(--shadow-md);
  padding: 16px 18px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: .9rem;
  font-weight: 700;
  margin-bottom: 10px;
}
.progress-bar-track {
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: #e5e7eb;
  margin-bottom: 12px;
}
.progress-bar-fill {
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #34d399, #10b981);
  transition: width .25s ease;
}
#progressSlider {
  width: 100%;
  accent-color: var(--accent);
}
.nav-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.controls-center {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  flex: 1;
}
.ctrl-btn {
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.94);
  color: var(--ink);
  font-size: .9rem;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.ctrl-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
  border-color: rgba(16,185,129,.34);
}
.ctrl-btn.active {
  background: linear-gradient(180deg, #10b981, #059669);
  color: #fff;
  border-color: transparent;
}
.icon-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.95);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 1.15rem;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.icon-mark:hover {
  transform: translateY(-1px) scale(1.03);
  box-shadow: var(--shadow-md);
  border-color: rgba(16,185,129,.34);
}
.show-answer-btn {
  min-height: 54px;
  width: 100%;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  box-shadow: var(--shadow-md);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}
.show-answer-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
}

/* ── LIST SCREENS ── */
.list-body { padding: 26px 0 54px; }
.list-panel { padding: 18px; }
.empty-state {
  text-align: center;
  color: var(--muted);
  padding: 42px 18px;
  font-size: 1rem;
}
.empty-state .em-icon {
  display: block;
  font-size: 2.8rem;
  margin-bottom: 12px;
}
.fav-card {
  position: relative;
  padding: 20px 52px 18px 20px;
  background: linear-gradient(180deg, #fff, #fbfdff);
  border: 1px solid rgba(226,232,240,.92);
  border-radius: 22px;
  box-shadow: var(--shadow-sm);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.fav-card + .fav-card { margin-top: 12px; }
.fav-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: rgba(16,185,129,.32);
}
.fav-sheet {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .78rem;
  font-weight: 800;
  color: var(--accent-dark);
  margin-bottom: 8px;
}
.fav-ko {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.65;
  color: var(--ink);
  margin-bottom: 7px;
}
.fav-en {
  font-size: .95rem;
  color: var(--muted);
  line-height: 1.6;
}
.fav-del {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 1rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.fav-del:hover {
  background: #fef2f2;
  color: var(--danger);
  border-color: #fecaca;
}

/* ── LOADING ── */
#loadingOverlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(8px);
  z-index: 999;
  color: var(--muted);
  font-weight: 700;
}
#loadingOverlay.show { display: flex; }
.spinner {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 3px solid rgba(16,185,129,.16);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  color: var(--danger);
  font-size: 1rem;
  line-height: 1.65;
  padding: 18px;
  background: #fff;
  border: 1px solid #fecaca;
  border-radius: 18px;
}

/* ── RESPONSIVE (base) ── */
@media (max-width: 860px) {
  .menu-grid { grid-template-columns: 1fr; }
  .nav-panel { flex-direction: column; align-items: stretch; }
  .nav-arrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
  }
  .controls-center { width: 100%; }
}
@media (max-width: 640px) {
  .top-bar { min-height: 68px; padding: 12px 12px; gap: 8px; }
  .icon-btn { padding: 9px 12px; font-size: .86rem; }
  .icon-btn .label-text { display: none; }
  .menu-body, .home-body, .learn-body, .list-body {
    width: min(100%, calc(100% - 18px));
  }
  .hero-card, .section-card, .progress-wrap, .nav-panel, .list-panel {
    border-radius: 22px;
  }
  .card { min-height: 160px; padding: 30px 20px 24px; border-radius: 22px; }
  .answer-cover { border-radius: 22px; }
  .card-text { font-size: 1.14rem; }
  .sheet-grid { grid-template-columns: 1fr; }
  .nav-arrow-row { display: flex; width: 100%; justify-content: space-between; }
}


/* ════════════════════════════════════════════════
   SVG ICON SYSTEM + DARK MODE
   (참고 파일 686–855 라인 그대로)
════════════════════════════════════════════════ */
.svg-icon {
  width: 1.18em;
  height: 1.18em;
  display: inline-block;
  vertical-align: -0.16em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon-only .svg-icon,
.home-btn .svg-icon,
.nav-arrow .svg-icon,
.tts-btn .svg-icon,
.icon-mark .svg-icon,
.theme-toggle .svg-icon { width: 20px; height: 20px; }
.menu-icon .svg-icon { width: 30px; height: 30px; }
.search-icon .svg-icon { width: 19px; height: 19px; }
.hint-icon .svg-icon { width: 22px; height: 22px; }
.brand-title::before { content: none; }
.brand-mark {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(16,185,129,.18), rgba(14,165,233,.12));
  color: var(--accent-dark);
}
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.9);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.theme-toggle:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: rgba(16,185,129,.34); }
.top-actions { display: inline-flex; align-items: center; gap: 8px; }

/* Compact horizontal menu cards */
.menu-grid { gap: 12px !important; }
.menu-btn {
  min-height: 92px !important;
  padding: 16px 18px !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: flex-start !important;
  text-align: left !important;
  gap: 14px !important;
}
.menu-btn > div {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: flex-start !important;
  gap: 12px !important;
  flex: 1 1 auto;
  min-width: 0;
}
.menu-icon {
  width: 48px !important;
  height: 48px !important;
  border-radius: 16px !important;
  flex: 0 0 auto;
}
.menu-icon .svg-icon { width: 25px !important; height: 25px !important; }
.menu-label { margin-top: 0 !important; white-space: nowrap; }
.menu-count { flex: 0 0 auto; margin-top: 0 !important; }

/* Nav panel: controls row + arrows row */
.nav-panel {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  justify-content: center !important;
  gap: 12px !important;
  padding: 12px !important;
}
.nav-panel .controls-center {
  order: 1;
  width: 100%;
  flex: 0 0 auto;
  background: var(--surface-soft);
  border: 1px solid rgba(226,232,240,.72);
  border-radius: 999px;
  padding: 6px;
  justify-content: center;
}
.ctrl-btn, .icon-mark { box-shadow: none !important; }
.icon-mark { color: var(--accent-dark); }
.nav-arrows {
  order: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}
.nav-arrows .nav-arrow { flex: 0 0 auto; }

/* List screen search */
.list-search-wrap { margin-bottom: 14px; position: relative; }
.list-search-wrap .search-icon {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); color: var(--muted);
}
.list-search-wrap input {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255,255,255,.95);
  color: var(--ink);
  outline: none;
  padding: 13px 16px 13px 46px;
  font-size: .98rem;
  box-shadow: var(--shadow-sm);
}
.list-search-wrap input:focus {
  border-color: rgba(16,185,129,.48);
  box-shadow: 0 0 0 4px rgba(16,185,129,.12), var(--shadow-sm);
}
.empty-state .svg-icon { width: 40px; height: 40px; color: var(--accent-dark); margin: 0 auto 12px; display: block; }
.fav-del .svg-icon { width: 17px; height: 17px; }

/* Usage guide */
.usage-guide {
  margin-top: 18px;
  border: 1px solid rgba(16,185,129,.18);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(236,253,245,.72));
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.usage-toggle {
  width: 100%;
  min-height: 64px;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-weight: 800;
  font-size: 1rem;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.usage-toggle-left { display: inline-flex; align-items: center; gap: 12px; }
.usage-toggle-icon {
  width: 42px; height: 42px;
  border-radius: 15px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-dark);
  flex: 0 0 auto;
}
.usage-toggle-icon .svg-icon { width: 22px; height: 22px; }
.usage-chevron { transition: transform .18s ease; color: var(--muted); }
.usage-guide.open .usage-chevron { transform: rotate(90deg); }
.usage-content {
  display: none;
  border-top: 1px solid rgba(16,185,129,.16);
  padding: 18px; color: var(--text);
}
.usage-guide.open .usage-content { display: block; }
.usage-content h3 { font-size: 1rem; color: var(--ink); margin: 0 0 10px; }
.usage-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
  list-style: none;
}
.usage-list li {
  position: relative; padding-left: 15px;
  line-height: 1.58; font-size: .94rem; color: var(--muted);
}
.usage-list li::before {
  content: ''; position: absolute; left: 0; top: .72em;
  width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
}
.usage-list strong { color: var(--ink); font-weight: 800; }

/* ── DARK MODE ── */
html[data-theme="dark"] {
  --accent: #34d399;
  --accent-dark: #6ee7b7;
  --accent-soft: rgba(16,185,129,.13);
  --accent-mid: rgba(52,211,153,.35);
  --ink: #f8fafc;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --line: rgba(148,163,184,.22);
  --surface: rgba(15,23,42,.78);
  --surface-strong: #111827;
  --surface-soft: rgba(30,41,59,.72);
  --bg1: #020617;
  --bg2: #0f172a;
  --shadow-sm: 0 8px 24px rgba(0,0,0,.24);
  --shadow-md: 0 18px 42px rgba(0,0,0,.34);
  --shadow-lg: 0 28px 64px rgba(0,0,0,.44);
}
html[data-theme="dark"] body {
  background:
    radial-gradient(circle at top left, rgba(52,211,153,.14), transparent 30%),
    radial-gradient(circle at top right, rgba(56,189,248,.10), transparent 24%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
}
html[data-theme="dark"] .top-bar,
html[data-theme="dark"] .hero-card,
html[data-theme="dark"] .section-card,
html[data-theme="dark"] .card,
html[data-theme="dark"] .progress-wrap,
html[data-theme="dark"] .nav-panel,
html[data-theme="dark"] .list-panel,
html[data-theme="dark"] .fav-card {
  background: linear-gradient(180deg, rgba(15,23,42,.88), rgba(15,23,42,.72));
  border-color: var(--line);
}
html[data-theme="dark"] .menu-btn,
html[data-theme="dark"] .sheet-btn,
html[data-theme="dark"] .icon-btn,
html[data-theme="dark"] .main-menu-link,
html[data-theme="dark"] .home-btn,
html[data-theme="dark"] .nav-arrow,
html[data-theme="dark"] .ctrl-btn,
html[data-theme="dark"] .icon-mark,
html[data-theme="dark"] .theme-toggle,
html[data-theme="dark"] .tts-btn,
html[data-theme="dark"] #searchInput,
html[data-theme="dark"] .list-search-wrap input {
  background: rgba(15,23,42,.82);
  color: var(--ink);
  border-color: var(--line);
}
html[data-theme="dark"] .menu-icon,
html[data-theme="dark"] .brand-mark,
html[data-theme="dark"] .menu-count,
html[data-theme="dark"] .nav-panel .controls-center {
  background: rgba(30,41,59,.8);
  border-color: var(--line);
}
html[data-theme="dark"] .answer-cover {
  background: rgba(15,23,42,.96);
  color: var(--muted);
}
html[data-theme="dark"] .progress-bar-track { background: rgba(51,65,85,.9); }
html[data-theme="dark"] .error-box { background: rgba(127,29,29,.24); border-color: rgba(248,113,113,.34); }
html[data-theme="dark"] .fav-del:hover { background: rgba(127,29,29,.26); border-color: rgba(248,113,113,.34); }
html[data-theme="dark"] .usage-guide {
  background: linear-gradient(180deg, rgba(15,23,42,.88), rgba(15,23,42,.72));
  border-color: var(--line);
}
html[data-theme="dark"] .usage-toggle { color: var(--ink); }
html[data-theme="dark"] .usage-content { border-top-color: var(--line); }

/* Responsive overrides */
@media (max-width: 860px) {
  .nav-panel { grid-template-columns: 48px 1fr 48px !important; }
  .menu-grid { grid-template-columns: 1fr !important; }
  .menu-btn { min-height: 78px !important; padding: 14px 16px !important; }
  .usage-list { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .theme-toggle { width: 40px; height: 40px; }
  .top-actions { gap: 6px; }
  .nav-panel { gap: 10px !important; padding: 12px !important; }
  .ctrl-btn { min-height: 40px; padding: 8px 12px; font-size: .84rem; }
  .icon-mark { width: 40px; height: 40px; }
  .nav-arrows .nav-arrow { width: 44px; height: 44px; }
  .menu-icon { width: 44px !important; height: 44px !important; }
  .usage-toggle { min-height: 58px; padding: 14px 15px; }
  .usage-content { padding: 16px; }
}

      <button aria-label="다크모드 전환" class="theme-toggle" id="themeBtn3" title="다크모드 전환" type="button"></button>
    </div>
  </div>
  <div class="list-body">
    <div class="list-search-wrap">
      <span class="search-icon">
        <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <input id="savedSearch" placeholder="북마크 검색..." type="text"/>
    </div>
    <div class="list-panel" id="savedList"></div>
  </div>
</div>


<!-- ══════════════════════════════════════
     SCRIPT
══════════════════════════════════════ -->
<script>
/* ── Config ── */
const SHEET_ID  = '10UzPEi1eDwrYFYi0dPjUDrRSHkxW6Je4Kt3VhHgt1mY';
const TAB_LABEL = { words:'📚 단어', sentences:'💬 문장', books:'📖 독해' };
const COUNT_ID  = { words:'wordsCount', sentences:'sentencesCount', books:'booksCount' };

/* ── Icons (참고 파일 ICONS 객체 그대로) ── */
const ICONS = {
  book: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>',
  bookFilled: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 6h8"/><path d="M8 10h6"/></svg>',
  bookmark: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  bookmarkFilled: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/><path d="M9 7h6"/></svg>',
  moon: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 15.5A8.5 8.5 0 0 1 8.5 3 7 7 0 1 0 21 15.5z"/></svg>',
  sun: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  x: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  alert: '<svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 9v5"/><path d="M12 18h.01"/></svg>'
};
function icon(name) { return ICONS[name] || ''; }

/* ── Theme (참고 파일 initTheme 그대로) ── */
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('theme', theme);
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    btn.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    btn.title = theme === 'dark' ? '라이트모드 전환' : '다크모드 전환';
    btn.setAttribute('aria-label', btn.title);
  });
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  const preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(saved || preferred);
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    btn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  });
}

/* ── State ── */
const $ = id => document.getElementById(id);
let currentTab = 'words', sentences = [], currentIdx = 0;
let learnMode  = 'KR_TO_EN', alwaysShowAnswer = false;
let bookmarks  = JSON.parse(localStorage.getItem('eng_bookmarks')  || '{}');
let savedPages = JSON.parse(localStorage.getItem('eng_savedPages') || '[]');
let currentFavoriteItems = [], currentSavedItems = [];
const dataCache = {};
const overlay   = $('loadingOverlay');
const cover     = $('answerCover');
const toggleBtn = $('answerToggleBtn');

function setLoading(on) { overlay.classList.toggle('show', on); }

/* ── Screen ── */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

/* ── Empty state (참고 파일 emptyState 그대로) ── */
function emptyState(iconName, text) {
  return `<div class="empty-state">${icon(iconName)}<div>${text}</div></div>`;
}

/* ── CSV Fetch ── */
async function fetchSheetData(tabName) {
  if (dataCache[tabName]) return dataCache[tabName];
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const rows = parseCSV(text).slice(1);
  const data = rows
    .map(cols => ({ number: unq(cols[0]), korean: unq(cols[1]), english: unq(cols[2]) }))
    .filter(r => r.number && (r.korean || r.english));
  dataCache[tabName] = data;
  const el = $(COUNT_ID[tabName]);
  if (el) el.textContent = `${data.length}개`;
  return data;
}
function unq(s) { return (s || '').replace(/^"|"$/g, '').trim(); }
function parseCSV(text) {
  const rows = []; let row = [], col = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { col += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { col += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(col); col = ''; }
      else if (c === '\n' || (c === '\r' && n === '\n')) {
        if (c === '\r') i++;
        row.push(col); rows.push(row); row = []; col = '';
      } else { col += c; }
    }
  }
  if (col || row.length) { row.push(col); rows.push(row); }
  return rows;
}

/* ── Load Tab ── */
async function loadTab(tabName, targetIdx = 0) {
  setLoading(true); currentTab = tabName;
  try {
    sentences  = await fetchSheetData(tabName);
    currentIdx = (targetIdx >= 0 && targetIdx < sentences.length) ? targetIdx : 0;
    showScreen('learn');
    renderLearn();
  } catch (e) {
    alert(`데이터를 불러오지 못했습니다.\n\n${e.message}\n\n스프레드시트 공유 설정 확인: '링크가 있는 모든 사용자 → 뷰어'`);
    console.error(e);
  } finally { setLoading(false); }
}

/* ── Render Learn (참고 파일 renderLearn 구조 그대로) ── */
function renderLearn() {
  const item = sentences[currentIdx]; if (!item) return;
  const total = sentences.length, pos = currentIdx + 1;
  const pct = Math.round((pos / total) * 100);

  $('learnTitle').textContent = `${TAB_LABEL[currentTab]} — ${item.number}번`;

  const q = learnMode === 'KR_TO_EN' ? item.korean  : item.english;
  const a = learnMode === 'KR_TO_EN' ? item.english : item.korean;
  $('learnQuestion').textContent = q;
  $('learnAnswer').textContent   = a;

  $('questionLabel').textContent    = learnMode === 'KR_TO_EN' ? 'KO 한국어' : 'EN 영어';
  $('answerLabel').textContent      = learnMode === 'KR_TO_EN' ? 'EN 영어'   : 'KO 한국어';
  $('answerLabel').style.background = learnMode === 'KR_TO_EN' ? '#475569'   : 'var(--accent)';

  $('progressText').textContent = `${pos} / ${total}`;
  $('progressPct').textContent  = `${pct}%`;
  $('progressFill').style.width = `${pct}%`;
  const slider = $('progressSlider'); slider.max = total; slider.value = pos;

  cover.classList.toggle('hide', alwaysShowAnswer);
  $('learnPrev').disabled = currentIdx === 0;
  $('learnNext').disabled = currentIdx === total - 1;
  toggleBtn.textContent = alwaysShowAnswer ? '정답 항상 켜기' : '정답 항상 끄기';
  toggleBtn.classList.toggle('active', alwaysShowAnswer);

  const bKey = `${currentTab}::${item.number}`;
  $('learnBookmark').innerHTML  = icon(bookmarks[bKey] ? 'bookFilled'     : 'book');
  $('learnSaveIcon').innerHTML  = icon(savedPages.some(p => p.tab === currentTab && String(p.number) === String(item.number))
    ? 'bookmarkFilled' : 'bookmark');
}

/* ── Learn Controls ── */
$('learnGoHome').onclick = $('learnMainMenuBtn').onclick = () => showScreen('home');
$('learnPrev').onclick = () => { if (currentIdx > 0) { currentIdx--; renderLearn(); } };
$('learnNext').onclick = () => { if (currentIdx < sentences.length - 1) { currentIdx++; renderLearn(); } };
$('learnSwitch').onclick  = () => { learnMode = learnMode === 'KR_TO_EN' ? 'EN_TO_KR' : 'KR_TO_EN'; renderLearn(); };
toggleBtn.onclick = () => { alwaysShowAnswer = !alwaysShowAnswer; cover.classList.toggle('hide', alwaysShowAnswer); toggleBtn.textContent = alwaysShowAnswer ? '정답 항상 켜기' : '정답 항상 끄기'; toggleBtn.classList.toggle('active', alwaysShowAnswer); };
$('showAnswerBtn').onclick = () => cover.classList.toggle('hide');
$('progressSlider').addEventListener('input', e => {
  const idx = Number(e.target.value) - 1;
  if (idx >= 0 && idx < sentences.length) { currentIdx = idx; renderLearn(); }
});

/* ── TTS ── */
function speak(text, lang) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}
$('learnTTS').onclick       = () => speak($('learnQuestion').textContent, learnMode === 'KR_TO_EN' ? 'ko-KR' : 'en-US');
$('learnTTSAnswer').onclick = () => speak($('learnAnswer').textContent,   learnMode === 'KR_TO_EN' ? 'en-US' : 'ko-KR');

/* ── Bookmark (단어장) ── */
$('learnBookmark').onclick = () => {
  const item = sentences[currentIdx];
  const key  = `${currentTab}::${item.number}`;
  if (bookmarks[key]) delete bookmarks[key];
  else bookmarks[key] = { tab: currentTab, ...item };
  localStorage.setItem('eng_bookmarks', JSON.stringify(bookmarks));
  renderLearn();
};

/* ── Save Page (북마크) ── */
$('learnSaveIcon').onclick = () => {
  const item = sentences[currentIdx];
  const idx  = savedPages.findIndex(p => p.tab === currentTab && String(p.number) === String(item.number));
  if (idx >= 0) savedPages.splice(idx, 1);
  else savedPages.push({ tab: currentTab, ...item });
  localStorage.setItem('eng_savedPages', JSON.stringify(savedPages));
  renderLearn();
};

/* ── Home Tab Buttons ── */
document.querySelectorAll('.menu-btn[data-tab]').forEach(btn =>
  btn.addEventListener('click', () => loadTab(btn.dataset.tab))
);

/* ── Favorite Screen (참고 파일 goFavorite 구조 그대로) ── */
$('goFavorite').onclick = async () => {
  showScreen('favorite');
  setLoading(true);
  const favEntries = Object.keys(bookmarks);
  if (!favEntries.length) {
    currentFavoriteItems = [];
    $('favoriteList').innerHTML = emptyState('book', '단어장에 저장된 문장이 없습니다');
    setLoading(false); return;
  }
  try {
    const items = [];
    for (const entry of favEntries) {
      if (entry.includes('::')) {
        const [tab, number] = entry.split('::');
        const rows = await fetchSheetData(tab);
        const found = rows.find(row => String(row.number) === String(number));
        if (found) items.push({ ...found, tab });
      }
    }
    currentFavoriteItems = items;
    renderFavorite(filterFavoriteItems());
  } catch (e) {
    console.error(e);
    $('favoriteList').innerHTML = `<div class="empty-state">${icon('alert')}<div>단어장을 불러오지 못했습니다<br>${e.message}</div></div>`;
  } finally { setLoading(false); }
};
function favoriteMatches(item, q) {
  if (!q) return true;
  return [item.tab, item.number, item.korean, item.english].join(' ').toLowerCase().includes(q.toLowerCase());
}
function filterFavoriteItems() {
  const q = $('favoriteSearch')?.value.trim() || '';
  return currentFavoriteItems.filter(item => favoriteMatches(item, q));
}
function renderFavorite(items) {
  const box = $('favoriteList'); box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = emptyState('book', currentFavoriteItems.length ? '검색 결과가 없습니다' : '단어장에 저장된 문장이 없습니다');
    return;
  }
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'fav-card';
    card.innerHTML = `
      <div class="fav-sheet">[${TAB_LABEL[item.tab] || item.tab}] ${item.number}번</div>
      <div class="fav-ko">${escapeHtml(item.korean)}</div>
      <div class="fav-en">${escapeHtml(item.english)}</div>`;
    const del = document.createElement('button');
    del.className = 'fav-del'; del.type = 'button'; del.innerHTML = icon('x');
    del.onclick = e => {
      e.stopPropagation();
      delete bookmarks[`${item.tab}::${item.number}`];
      localStorage.setItem('eng_bookmarks', JSON.stringify(bookmarks));
      currentFavoriteItems = currentFavoriteItems.filter(r => !(r.tab === item.tab && String(r.number) === String(item.number)));
      renderFavorite(filterFavoriteItems());
    };
    card.appendChild(del); box.appendChild(card);
  });
}
$('favoriteSearch').addEventListener('input', () => renderFavorite(filterFavoriteItems()));

/* ── Saved Screen (참고 파일 goSaved 구조 그대로) ── */
$('goSaved').onclick = () => { showScreen('saved'); renderSaved(); };
function savedMatches(item, q) {
  if (!q) return true;
  return [item.tab, item.number, item.korean].join(' ').toLowerCase().includes(q.toLowerCase());
}
function filterSavedItems() {
  const q = $('savedSearch')?.value.trim() || '';
  return currentSavedItems.filter(item => savedMatches(item, q));
}
function renderSaved(items = null) {
  const box = $('savedList');
  if (items === null) { currentSavedItems = [...savedPages]; items = filterSavedItems(); }
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = emptyState('bookmark', currentSavedItems.length ? '검색 결과가 없습니다' : '저장된 북마크가 없습니다');
    return;
  }
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'fav-card';
    card.innerHTML = `
      <div class="fav-sheet">[${TAB_LABEL[item.tab] || item.tab}] ${item.number}번</div>
      <div class="fav-ko">${escapeHtml(item.korean)}</div>`;
    const del = document.createElement('button');
    del.className = 'fav-del'; del.type = 'button'; del.innerHTML = icon('x');
    del.onclick = e => {
      e.stopPropagation();
      const idx = savedPages.findIndex(p => p.tab === item.tab && String(p.number) === String(item.number));
      if (idx >= 0) savedPages.splice(idx, 1);
      localStorage.setItem('eng_savedPages', JSON.stringify(savedPages));
      currentSavedItems = [...savedPages];
      renderSaved(filterSavedItems());
    };
    card.appendChild(del);
    card.onclick = () => {
      const targetNum = String(item.number);
      fetchSheetData(item.tab).then(data => {
        const idx = data.findIndex(s => String(s.number) === targetNum);
        loadTab(item.tab, idx >= 0 ? idx : 0);
      });
    };
    box.appendChild(card);
  });
}
$('savedSearch').addEventListener('input', () => renderSaved(filterSavedItems()));

/* ── Usage Guide (참고 파일 renderUsageGuide / initUsageGuide 그대로) ── */
const USAGE_ITEMS = [
  ['단어 / 문장 / 독해', '학습할 자료 유형을 선택합니다.'],
  ['KO ↔ EN', '한국어→영어, 영어→한국어 방향으로 학습 언어를 전환합니다.'],
  ['정답 보기 / 숨기기', '현재 문장의 정답 영역만 즉시 열거나 가립니다.'],
  ['정답 항상 켜기/끄기', '다음 문장으로 넘어가도 정답을 계속 보이게 하거나 다시 가립니다.'],
  ['슬라이더 / 진도바', '문장 번호를 빠르게 이동하거나 현재 학습 위치를 확인합니다.'],
  ['단어장 (책 아이콘)', '중요 문장을 저장해 단어장 화면에서 모아보고 검색할 수 있습니다.'],
  ['북마크 (리본 아이콘)', '현재 페이지를 저장하고 북마크 탭에서 버튼을 누르면 바로 이동합니다.'],
  ['스피커', '문제 또는 정답 문장을 음성으로 들어볼 수 있습니다.'],
  ['검색', '단어장·북마크 화면에서 텍스트로 검색합니다.'],
  ['다크모드/라이트모드', '상단의 달/해 버튼으로 화면 테마를 전환합니다.']
];
function renderUsageGuide() {
  const open = $('usageGuide').classList.contains('open');
  $('usageToggleLabel').textContent = open ? '사용법 닫기' : '사용법 보기';
  $('usageContent').innerHTML = `<h3>버튼과 기능 안내</h3><ul class="usage-list">${
    USAGE_ITEMS.map(([t, d]) => `<li><strong>${escapeHtml(t)}</strong>: ${escapeHtml(d)}</li>`).join('')
  }</ul>`;
}
function initUsageGuide() {
  const guide  = $('usageGuide');
  const toggle = $('usageToggle');
  if (!guide || !toggle) return;
  toggle.addEventListener('click', () => {
    const open = !guide.classList.contains('open');
    guide.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    $('usageToggleLabel').textContent = open ? '사용법 닫기' : '사용법 보기';
    renderUsageGuide();
  });
}

/* ── Helper ── */
function escapeHtml(v) {
  return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

/* ── Init ── */
renderUsageGuide();
initUsageGuide();
initTheme();

/* ── Service Worker ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
